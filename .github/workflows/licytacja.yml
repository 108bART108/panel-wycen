name: Bot licytacji

on:
  schedule:
    - cron: "*/30 * * * *"     # co 30 minut
  workflow_dispatch: {}        # ręczne uruchomienie: Actions → Bot licytacji → Run workflow

concurrency:
  group: licytacja
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - run: pip install -r bot/requirements.txt
      - run: python bot/licytacja.py
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          PANEL_URL: ${{ vars.PANEL_URL }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL || 'bz@ibprojekt.eu' }}
          GODZINY_KOMUNIKATU: "2"
          GODZINY_PRZYPOMNIENIA: "6"
          DZIEKUJ_PO_KONCU: "nie"
